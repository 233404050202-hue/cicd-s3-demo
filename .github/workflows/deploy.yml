name: Deploy website len S3

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Lay code tu repository
        uses: actions/checkout@v4

      - name: Kiem tra website (Build/Test)
        shell: bash
        run: |
          if [ ! -f site/index.html ]; then
            echo "LOI: khong tim thay site/index.html"
            exit 1
          fi

          if grep -Fq 'Ánh Ngọc' site/index.html &&
             grep -Fq '233404051053' site/index.html; then
            echo "OK: Da dien dung ten va ma sinh vien"
          else
            echo "LOI: Thieu hoac sai ten, ma sinh vien"
            exit 1
          fi

          echo "OK: Website san sang deploy"

      - name: Cau hinh AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Deploy len S3
        run: aws s3 sync site/ s3://cicd-web-anhngoc-2026 --delete
